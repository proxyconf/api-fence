openapi: 3.0.0
info:
  title: Sample API for Testing
  description: A simple API used for testing the OpenAPI filter
  version: 1.0.0

servers:
  - url: http://localhost:10000
    description: Local Envoy proxy

paths:
  /api/users:
    get:
      summary: List all users
      description: Returns a list of users with optional pagination
      operationId: listUsers
      parameters:
        - name: limit
          in: query
          description: Maximum number of users to return
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: offset
          in: query
          description: Number of users to skip
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: X-API-Key
          in: header
          description: API key for authentication
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9-]+$'
            minLength: 10
        - name: X-Request-ID
          in: header
          description: Optional request ID for tracing
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful response
          headers:
            X-Response-ID:
              description: Response ID matching the request
              required: false
              schema:
                type: string
                format: uuid
            X-Rate-Limit-Remaining:
              description: Number of requests remaining in the current window
              required: true
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  total:
                    type: integer
        '400':
          description: Invalid request parameters
        '401':
          description: Missing or invalid API key
          
    post:
      summary: Create a new user
      description: Creates a new user with the provided information
      operationId: createUser
      parameters:
        - name: X-API-Key
          in: header
          description: API key for authentication
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9-]+$'
            minLength: 10
        - name: Content-Type
          in: header
          description: Content type must be application/json
          required: true
          schema:
            type: string
            enum: ["application/json"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: User created successfully
          headers:
            Location:
              description: URL of the created user
              required: true
              schema:
                type: string
                pattern: '^/api/users/\d+$'
            X-Rate-Limit-Remaining:
              description: Number of requests remaining in the current window
              required: true
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid request body
        '401':
          description: Missing or invalid API key
        '409':
          description: User already exists

  /api/users/{userId}:
    parameters:
      - name: userId
        in: path
        description: User ID
        required: true
        schema:
          type: integer
          minimum: 1
    
    get:
      summary: Get user by ID
      description: Returns a single user
      operationId: getUserById
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found
    
    put:
      summary: Update user
      description: Updates an existing user
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid request body
        '404':
          description: User not found
    
    delete:
      summary: Delete user
      description: Deletes a user
      operationId: deleteUser
      responses:
        '204':
          description: User deleted successfully
        '404':
          description: User not found

  /api/users/{userId}/posts:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    
    get:
      summary: Get user's posts
      description: Returns all posts by a specific user
      operationId: getUserPosts
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
        '404':
          description: User not found

components:
  schemas:
    User:
      type: object
      required:
        - id
        - name
        - email
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: "John Doe"
        email:
          type: string
          format: email
          example: "john@example.com"
        age:
          type: integer
          minimum: 0
          maximum: 150
          example: 30
        createdAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00Z"
    
    UserCreate:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
        age:
          type: integer
          minimum: 0
          maximum: 150
    
    UserUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
        age:
          type: integer
          minimum: 0
          maximum: 150
    
    Post:
      type: object
      required:
        - id
        - userId
        - title
        - content
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        title:
          type: string
          minLength: 1
          maxLength: 200
        content:
          type: string
          minLength: 1
        createdAt:
          type: string
          format: date-time
