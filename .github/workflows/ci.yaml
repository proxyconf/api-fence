name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    tags: ["*"]
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_EXPERIMENTAL: true
  # Builder image name used by scripts/build-in-docker.sh
  BUILDER_IMAGE: api_fence-builder

jobs:
  # ------------------------------------------------------------------
  # Static checks: formatting, clippy, audit  (run once, no Envoy)
  # ------------------------------------------------------------------
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3

      # Install libmodsecurity-dev on the runner so cargo check/clippy can link
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libmodsecurity-dev

      - name: Format check
        run: mise run fmt-check
      - name: Clippy
        run: mise run clippy
      - name: Security audit
        run: mise run audit

  # ------------------------------------------------------------------
  # Unit tests  (run once, no Envoy)
  # ------------------------------------------------------------------
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libmodsecurity-dev

      - name: Run unit tests
        run: mise run test-unit

  # ------------------------------------------------------------------
  # Build the Docker builder image (shared by integration + build jobs)
  # ------------------------------------------------------------------
  builder-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and cache builder image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.builder
          tags: ${{ env.BUILDER_IMAGE }}:latest
          load: true
          cache-from: type=gha,scope=builder
          cache-to: type=gha,scope=builder,mode=max

      - name: Save builder image
        run: docker save ${{ env.BUILDER_IMAGE }}:latest | gzip > /tmp/builder-image.tar.gz

      - name: Upload builder image
        uses: actions/upload-artifact@v4
        with:
          name: builder-image
          path: /tmp/builder-image.tar.gz
          retention-days: 1

  # ------------------------------------------------------------------
  # Integration tests  (matrix: stable + dev Envoy)
  # ------------------------------------------------------------------
  integration-test:
    runs-on: ubuntu-latest
    needs: [check, unit-test, builder-image]
    strategy:
      fail-fast: false
      matrix:
        envoy_version: [stable, dev]
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3

      - name: Download builder image
        uses: actions/download-artifact@v4
        with:
          name: builder-image
          path: /tmp

      - name: Load builder image
        run: docker load < /tmp/builder-image.tar.gz

      - name: Run integration tests (Envoy ${{ matrix.envoy_version }})
        run: ENVOY_VERSION=${{ matrix.envoy_version }} mise run test-integration

  # ------------------------------------------------------------------
  # Release build  (matrix: stable + dev Envoy, only after tests pass)
  # ------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    needs: [integration-test]
    strategy:
      matrix:
        envoy_version: [stable, dev]
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3

      - name: Download builder image
        uses: actions/download-artifact@v4
        with:
          name: builder-image
          path: /tmp

      - name: Load builder image
        run: docker load < /tmp/builder-image.tar.gz

      - name: Build release (${{ matrix.envoy_version }})
        run: ENVOY_VERSION=${{ matrix.envoy_version }} mise run build-for-envoy

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: api_fence-${{ matrix.envoy_version }}-linux-x86_64
          path: |
            target/docker-release/libapi_fence.so
            target/docker-release/lib/

  # ------------------------------------------------------------------
  # GitHub Release  (only on tag push)
  # ------------------------------------------------------------------
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          for dir in artifacts/api_fence-*-linux-*; do
            SUFFIX=$(basename "$dir" | sed 's/^api_fence-//')
            # Create a tarball with the .so and its runtime libs
            tar -czf "release/api_fence-${SUFFIX}.tar.gz" -C "$dir" .
          done
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
