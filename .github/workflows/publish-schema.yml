# Publish JSON Schema for API Fence configuration
#
# This workflow exports the configuration JSON Schema and publishes it
# to GitHub Pages, making it available for the ProxyConf website to fetch
# at build time for documentation generation.
#
# The schema is published to:
#   https://proxyconf.github.io/api-fence/config-schema.json

name: Publish JSON Schema

on:
  push:
    branches:
      - main
    paths:
      - 'src/**/*.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/publish-schema.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-action@stable
        with:
          toolchain: stable

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-schema-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-schema-

      - name: Build export-schema binary
        run: cargo build --release --bin export-schema

      - name: Export JSON Schema
        run: |
          mkdir -p _site
          ./target/release/export-schema --pretty > _site/config-schema.json
          
          # Create a simple index page
          cat > _site/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <title>API Fence Schema</title>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0;url=config-schema.json">
          </head>
          <body>
            <p>Redirecting to <a href="config-schema.json">config-schema.json</a>...</p>
          </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-schema
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
