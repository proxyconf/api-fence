# Mise configuration for API Fence - Envoy OpenAPI Filter
# Replaces the previous Nix/Flake setup

[env]
# Rust configuration
RUST_BACKTRACE = "1"
CARGO_HOME = "{{cwd}}/.cargo"

# Required for building with bindgen (Envoy SDK)
# These may need adjustment based on system LLVM installation
_.path = ["{{cwd}}/.cargo/bin"]

[tools]
# Rust toolchain - stable with necessary components
rust = "stable"

# Development tools
"cargo:cargo-watch" = "latest"
"cargo:cargo-edit" = "latest"
"cargo:cargo-outdated" = "latest"
"cargo:bacon" = "latest"
"cargo:cargo-audit" = "latest"

# Documentation
"cargo:mdbook" = "latest"

# System tools (installed via package manager, mise just ensures they're available)
jq = "latest"

[tasks.build]
description = "Build the filter in release mode"
run = "cargo build --release"

[tasks.build-dev]
description = "Build the filter in debug mode"
run = "cargo build"

[tasks.test]
description = "Run all tests"
run = "cargo test"

[tasks.test-unit]
description = "Run unit tests only"
run = "cargo test --lib"

[tasks.test-integration]
description = "Run integration tests against Envoy in Docker (set ENVOY_VERSION=stable|dev)"
run = '''
#!/usr/bin/env bash
set -euo pipefail

ENVOY_VERSION="${ENVOY_VERSION:-stable}"
VERSIONS_FILE="envoy-versions.json"

# Resolve Docker image and SDK revision
DOCKER_IMAGE=$(jq -r ".versions.${ENVOY_VERSION}.docker_image" "$VERSIONS_FILE")
SDK_REV=$(jq -r ".versions.${ENVOY_VERSION}.sdk_rev // empty" "$VERSIONS_FILE")

if [[ -z "$SDK_REV" ]]; then
  echo "==> Extracting SDK revision from $DOCKER_IMAGE..."
  SDK_REV=$(./scripts/get-envoy-sdk-rev.sh "$DOCKER_IMAGE")
fi

echo "==> Envoy version : $ENVOY_VERSION"
echo "    Docker image   : $DOCKER_IMAGE"
echo "    SDK rev        : $SDK_REV"

# Patch Cargo.toml to match the target Envoy SDK
./scripts/set-envoy-sdk-rev.sh "$SDK_REV"

# Determine build mode
BUILD_FLAGS=""
BUILD_MODE="debug"
if [ "${INTEGRATION_TEST_RELEASE:-}" = "1" ] || [ "${INTEGRATION_TEST_RELEASE:-}" = "true" ]; then
  BUILD_FLAGS="--release"
  BUILD_MODE="release"
fi

# Build the filter inside Docker (Ubuntu 22.04, matching Envoy's base)
echo "==> Building filter (${BUILD_MODE}) in Docker..."
./scripts/build-in-docker.sh ${BUILD_FLAGS}

# Stop any previous container, then start Envoy
./scripts/envoy-container.sh stop
echo "==> Starting Envoy ($DOCKER_IMAGE)..."
./scripts/envoy-container.sh start "$DOCKER_IMAGE" "$BUILD_MODE"

# Run integration tests inside Docker (so libmodsecurity is available for linking)
echo "==> Running integration tests..."
RESULT=0
./scripts/test-in-docker.sh --test integration -- --ignored || RESULT=$?

# Cleanup
echo "==> Stopping Envoy..."
./scripts/envoy-container.sh stop

exit $RESULT
'''

[tasks.test-modsec]
description = "Run ModSecurity WAF integration tests (set ENVOY_VERSION=stable|dev)"
run = '''
#!/usr/bin/env bash
set -euo pipefail

ENVOY_VERSION="${ENVOY_VERSION:-stable}"
VERSIONS_FILE="envoy-versions.json"

DOCKER_IMAGE=$(jq -r ".versions.${ENVOY_VERSION}.docker_image" "$VERSIONS_FILE")
SDK_REV=$(jq -r ".versions.${ENVOY_VERSION}.sdk_rev // empty" "$VERSIONS_FILE")

if [[ -z "$SDK_REV" ]]; then
  SDK_REV=$(./scripts/get-envoy-sdk-rev.sh "$DOCKER_IMAGE")
fi

./scripts/set-envoy-sdk-rev.sh "$SDK_REV"

echo "==> Building filter in Docker..."
./scripts/build-in-docker.sh

./scripts/envoy-container.sh stop
echo "==> Starting Envoy ($DOCKER_IMAGE)..."
./scripts/envoy-container.sh start "$DOCKER_IMAGE" debug

RESULT=0
./scripts/test-in-docker.sh --test integration test_modsecurity -- --ignored --test-threads=1 || RESULT=$?

echo "==> Stopping Envoy..."
./scripts/envoy-container.sh stop

exit $RESULT
'''

[tasks.test-modsec-verbose]
description = "Run ModSecurity WAF tests with verbose output (set ENVOY_VERSION=stable|dev)"
run = '''
#!/usr/bin/env bash
set -euo pipefail

ENVOY_VERSION="${ENVOY_VERSION:-stable}"
VERSIONS_FILE="envoy-versions.json"

DOCKER_IMAGE=$(jq -r ".versions.${ENVOY_VERSION}.docker_image" "$VERSIONS_FILE")
SDK_REV=$(jq -r ".versions.${ENVOY_VERSION}.sdk_rev // empty" "$VERSIONS_FILE")

if [[ -z "$SDK_REV" ]]; then
  SDK_REV=$(./scripts/get-envoy-sdk-rev.sh "$DOCKER_IMAGE")
fi

./scripts/set-envoy-sdk-rev.sh "$SDK_REV"

echo "==> Building filter in Docker..."
./scripts/build-in-docker.sh

./scripts/envoy-container.sh stop
echo "==> Starting Envoy ($DOCKER_IMAGE)..."
./scripts/envoy-container.sh start "$DOCKER_IMAGE" debug

RESULT=0
./scripts/test-in-docker.sh --test integration test_modsecurity -- --ignored --test-threads=1 --nocapture || RESULT=$?

echo "==> Stopping Envoy..."
./scripts/envoy-container.sh stop

exit $RESULT
'''

[tasks.check]
description = "Check code without building"
run = "cargo check --all-targets"

[tasks.fmt]
description = "Format code"
run = "cargo fmt"

[tasks.fmt-check]
description = "Check code formatting"
run = "cargo fmt -- --check"

[tasks.clippy]
description = "Run clippy linter"
run = "cargo clippy --all-targets -- -D warnings"

[tasks.doc]
description = "Generate and open documentation"
run = "cargo doc --no-deps --open"

[tasks.watch]
description = "Watch for changes and run tests"
run = "cargo watch -x test"

[tasks.watch-clippy]
description = "Watch for changes and run clippy"
run = "cargo watch -x clippy"

[tasks.clean]
description = "Clean build artifacts"
run = "cargo clean && rm -rf target/"

[tasks.audit]
description = "Audit dependencies for security issues"
run = "cargo audit"

[tasks.quality]
description = "Run all quality checks (fmt-check, clippy, test)"
depends = ["fmt-check", "clippy", "test"]

[tasks.pre-commit]
description = "Pre-commit hook checks (fmt, clippy, test)"
depends = ["fmt", "clippy", "test"]

[tasks.build-for-envoy]
description = "Build release artifact for a specific Envoy version (set ENVOY_VERSION=stable|dev)"
run = '''
#!/usr/bin/env bash
set -euo pipefail

ENVOY_VERSION="${ENVOY_VERSION:-stable}"
VERSIONS_FILE="envoy-versions.json"

DOCKER_IMAGE=$(jq -r ".versions.${ENVOY_VERSION}.docker_image" "$VERSIONS_FILE")
SDK_REV=$(jq -r ".versions.${ENVOY_VERSION}.sdk_rev // empty" "$VERSIONS_FILE")

if [[ -z "$SDK_REV" ]]; then
  echo "==> Extracting SDK revision from $DOCKER_IMAGE..."
  SDK_REV=$(./scripts/get-envoy-sdk-rev.sh "$DOCKER_IMAGE")
fi

echo "==> Building for Envoy $ENVOY_VERSION"
echo "    Docker image : $DOCKER_IMAGE"
echo "    SDK rev      : $SDK_REV"

./scripts/set-envoy-sdk-rev.sh "$SDK_REV"
./scripts/build-in-docker.sh --release

echo "==> Built: target/docker-release/libapi_fence.so"
'''

[tasks.use-envoy]
description = "Switch SDK revision to match a specific Envoy version (set ENVOY_VERSION=stable|dev)"
run = '''
#!/usr/bin/env bash
set -euo pipefail

ENVOY_VERSION="${ENVOY_VERSION:-stable}"
VERSIONS_FILE="envoy-versions.json"

if ! jq -e ".versions.${ENVOY_VERSION}" "$VERSIONS_FILE" >/dev/null 2>&1; then
  echo "ERROR: Unknown version '$ENVOY_VERSION'"
  echo "Available versions:"
  jq -r '.versions | keys[]' "$VERSIONS_FILE"
  exit 1
fi

DOCKER_IMAGE=$(jq -r ".versions.${ENVOY_VERSION}.docker_image" "$VERSIONS_FILE")
SDK_REV=$(jq -r ".versions.${ENVOY_VERSION}.sdk_rev // empty" "$VERSIONS_FILE")

if [[ -z "$SDK_REV" ]]; then
  echo "==> Extracting SDK revision from $DOCKER_IMAGE..."
  SDK_REV=$(./scripts/get-envoy-sdk-rev.sh "$DOCKER_IMAGE")
fi

echo "==> Switching to Envoy $ENVOY_VERSION"
echo "    Docker image : $DOCKER_IMAGE"
echo "    SDK rev      : $SDK_REV"

./scripts/set-envoy-sdk-rev.sh "$SDK_REV"

echo "==> Done. Run 'cargo build' to rebuild with the new SDK."
'''

[tasks.run-envoy]
description = "Run Envoy in Docker with the filter (set ENVOY_VERSION=stable|dev)"
run = '''
#!/usr/bin/env bash
set -euo pipefail

ENVOY_VERSION="${ENVOY_VERSION:-stable}"
VERSIONS_FILE="envoy-versions.json"

DOCKER_IMAGE=$(jq -r ".versions.${ENVOY_VERSION}.docker_image" "$VERSIONS_FILE")

echo "==> Starting Envoy ($DOCKER_IMAGE)..."
./scripts/envoy-container.sh start "$DOCKER_IMAGE" "${BUILD_MODE:-debug}"
echo "==> Envoy is running. Press Ctrl-C to stop."
echo "    Admin:      http://127.0.0.1:18081"
echo "    Validation: http://127.0.0.1:18080"
echo "    ModSec:     http://127.0.0.1:18090"

# Wait for Ctrl-C, then clean up
trap './scripts/envoy-container.sh stop' INT TERM
docker logs -f api_fence_envoy 2>&1 || true
./scripts/envoy-container.sh stop
'''

[tasks.ci]
description = "CI pipeline (format check, clippy, unit tests, audit)"
run = '''
#!/usr/bin/env bash
set -euo pipefail

echo "==> Checking formatting"
mise run fmt-check

echo "==> Running clippy"
mise run clippy

echo "==> Running unit tests"
mise run test-unit

echo "==> Auditing dependencies"
mise run audit

echo "==> CI checks completed successfully"
'''

[tasks.info]
description = "Show development environment info"
run = '''
#!/usr/bin/env bash
set -euo pipefail

echo "Envoy OpenAPI Filter Development Environment"
echo "============================================="
echo "Rust version : $(rustc --version)"
echo "Cargo version: $(cargo --version)"
echo ""
echo "Current SDK revision:"
grep '^envoy-proxy-dynamic-modules-rust-sdk' Cargo.toml 2>/dev/null \
  || grep 'envoy-proxy-dynamic-modules-rust-sdk' Cargo.toml | grep -v '^#' | head -1
echo ""
echo "Available Envoy versions:"
if [[ -f envoy-versions.json ]]; then
  jq -r '.versions | to_entries[] | "  \(.key): \(.value.docker_image) (sdk_rev: \(.value.sdk_rev // "dynamic"))"' envoy-versions.json
else
  echo "  (envoy-versions.json not found)"
fi
echo ""
echo "Available tasks: mise tasks"
'''

[tasks.help]
description = "Show available tasks"
run = "mise tasks"
