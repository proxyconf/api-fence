[package]
name = "api_fence"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Your Name <your.email@example.com>"]

[lib]
name = "api_fence"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "export-schema"
path = "src/bin/export-schema.rs"

[dependencies]
# Envoy dynamic modules SDK - must match Envoy version.
# Use `mise run use-envoy ENVOY_VERSION=stable|dev` to switch revisions.
envoy-proxy-dynamic-modules-rust-sdk = { git = "https://github.com/envoyproxy/envoy", rev = "3909deb175ef358202d6ab4f94d683ffc0fdb477" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# OpenAPI parsing and validation
openapiv3 = "2.0"
serde_yaml = "0.9"
indexmap = "2.0"
# JSON Schema validation
jsonschema = "0.18"
# Schema cache with TTL support
moka = { version = "0.12", features = ["sync"] }
# Media type parsing
mime = "0.3"
# URL path matching and parsing
matchit = "0.8"
regex = "1.10"
urlencoding = "2.1"
# Form data parsing
multer = "3.1"
futures = "0.3"
form_urlencoded = "1.2"
base64 = "0.22"
bytes = "1.0"
# XML parsing and serialization
quick-xml = "0.36"
serde-xml-rs = "0.6"
# Fake data generation for mocking
fake = { version = "2.9", features = ["derive", "chrono", "http", "uuid"] }
# Error handling
thiserror = "1.0"
rand = "0.8"
uuid = { version = "1.0", features = ["v4"] }
chrono = "0.4"
# Glob patterns for file matching
glob = "0.3"
# JSON Schema generation for documentation
schemars = { version = "0.8", features = ["preserve_order", "chrono"] }

[dev-dependencies]
# Integration testing dependencies
tempfile = "3"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }

[build-dependencies]
regex = "1.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
